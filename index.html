<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Grid Game - Geocaches & Potions</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #game-container {
      margin-top: 20px;
      position: relative;
    }
    canvas {
      border: 4px solid #333;
      background-color: #2e7d32; /* Grass color */
      display: block;
    }
    #ui {
      margin-top: 10px;
      display: flex;
      gap: 20px;
      font-size: 18px;
    }
    .instructions {
      margin-top: 10px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Map Exploration</h1>
  
  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="640"></canvas>
  </div>

  <div id="ui">
    <div>HP: <span id="hp-display">100</span> / <span id="max-hp-display">100</span></div>
    <div>Caches Found: <span id="cache-display">0</span></div>
    <div>Heal Potions: <span id="heal-display">0</span></div>
    <div>Overheals: <span id="overheal-display">0</span></div>
  </div>

  <div class="instructions">
    Use <b>WASD</b> or <b>Arrow Keys</b> to move. Walk over bushes to search them. Press <b>1</b> for Heal, <b>2</b> for Overheal.
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- GAME SETTINGS ---
    const GRID_SIZE = 16;       // 16x16 Grid
    const TILE_SIZE = 40;       // 40px per cell = 640x640 canvas
    
    // --- PLAYER STATE ---
    const player = {
      x: 0,
      y: 0,
      hp: 70,
      maxHp: 100,
      overhealMax: 150,
      caches: 0,
      inventory: {
        heal: 0,
        over_heal: 0
      }
    };

    // --- MAP DATA ---
    // 0: Empty, 1: Obstacle (Tree/Rock), 2: Bush
    const map = [];
    const bushData = {}; // Stores items inside bushes by tile coordinate "x,y"

    function initMap() {
      for (let r = 0; r < GRID_SIZE; r++) {
        map[r] = [];
        for (let c = 0; c < GRID_SIZE; c++) {
          // Keep starting position clear
          if (r === 0 && c === 0) {
            map[r][c] = 0;
            continue;
          }

          const rand = Math.random();
          if (rand < 0.15) {
            map[r][c] = 1; // Obstacle (Tree/Rock)
          } else if (rand < 0.40) {
            map[r][c] = 2; // Bush

            // Populate bush contents (CACHE OR POTION, NEVER BOTH)
            generateBushLoot(r, c);
          } else {
            map[r][c] = 0; // Empty Ground
          }
        }
      }
    }

    // --- BALANCED LOOT GENERATION ---
    function generateBushLoot(r, c) {
      const key = `${c},${r}`;

      // 1. Roll for Geocache (5% chance)
      if (Math.random() < 0.05) {
        bushData[key] = { type: 'cache' };
        return; // Mutually exclusive: strictly NO potion if cache exists
      }

      // 2. Roll for Potion (Only if no cache)
      const potionRoll = Math.random();
      
      // 15% overall chance to contain any potion
      if (potionRoll < 0.15) {
        // Weighted roll: 85% Standard Heal, 15% Rare Overheal
        const isOverheal = Math.random() < 0.15;
        bushData[key] = {
          type: 'potion',
          item: isOverheal ? 'over_heal' : 'heal'
        };
      } else {
        bushData[key] = { type: 'empty' };
      }
    }

    // --- CONTROLS ---
    window.addEventListener('keydown', (e) => {
      let dx = 0;
      let dy = 0;

      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dy = -1;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dy = 1;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dx = -1;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dx = 1;

      // Potion shortcuts
      if (e.key === '1') usePotion('heal');
      if (e.key === '2') usePotion('over_heal');

      if (dx !== 0 || dy !== 0) {
        movePlayer(dx, dy);
      }
    });

    function movePlayer(dx, dy) {
      const newX = player.x + dx;
      const newY = player.y + dy;

      // Map boundary check
      if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) return;

      // Obstacle collision check
      if (map[newY][newX] === 1) return;

      // Move player
      player.x = newX;
      player.y = newY;

      // Interact with bush
      if (map[newY][newX] === 2) {
        searchBush(newX, newY);
      }

      updateUI();
      draw();
    }

    // --- BUSH SEARCH LOGIC ---
    function searchBush(x, y) {
      const key = `${x},${y}`;
      const contents = bushData[key];

      if (!contents || contents.type === 'searched') return;

      if (contents.type === 'cache') {
        player.caches += 1;
        alert("🎉 You discovered a hidden Geocache!");
      } else if (contents.type === 'potion') {
        if (contents.item === 'heal') {
          player.inventory.heal += 1;
          alert("🧪 Found a Standard Heal Potion!");
        } else if (contents.item === 'over_heal') {
          player.inventory.over_heal += 1;
          alert("✨ Rare Find! You found an Overheal Potion!");
        }
      }

      // Mark bush as searched so it can't be looted again
      bushData[key] = { type: 'searched' };
    }

    // --- POTION CONSUMPTION LOGIC ---
    function usePotion(type) {
      if (type === 'heal' && player.inventory.heal > 0) {
        if (player.hp >= player.maxHp) return;
        player.inventory.heal--;
        player.hp = Math.min(player.maxHp, player.hp + 30);
      } else if (type === 'over_heal' && player.inventory.over_heal > 0) {
        if (player.hp >= player.overhealMax) return;
        player.inventory.over_heal--;
        player.hp = Math.min(player.overhealMax, player.hp + 50);
      }
      updateUI();
      draw();
    }

    // --- RENDERING ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Grid Map
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const x = c * TILE_SIZE;
          const y = r * TILE_SIZE;

          // Grid border
          ctx.strokeStyle = 'rgba(0,0,0,0.1)';
          ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);

          if (map[r][c] === 1) {
            // Tree/Obstacle
            ctx.fillStyle = '#1b5e20';
            ctx.fillRect(x + 4, y + 4, TILE_SIZE - 8, TILE_SIZE - 8);
          } else if (map[r][c] === 2) {
            // Bush
            const key = `${c},${r}`;
            const isSearched = bushData[key]?.type === 'searched';
            
            ctx.fillStyle = isSearched ? '#558b2f' : '#33691e';
            ctx.beginPath();
            ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE / 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Render Player
      const px = player.x * TILE_SIZE + TILE_SIZE / 2;
      const py = player.y * TILE_SIZE + TILE_SIZE / 2;

      ctx.fillStyle = '#ffeb3b'; // Player color
      ctx.beginPath();
      ctx.arc(px, py, TILE_SIZE / 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#000';
      ctx.stroke();
    }

    function updateUI() {
      document.getElementById('hp-display').innerText = player.hp;
      document.getElementById('max-hp-display').innerText = player.hp > 100 ? player.overhealMax : player.maxHp;
      document.getElementById('cache-display').innerText = player.caches;
      document.getElementById('heal-display').innerText = player.inventory.heal;
      document.getElementById('overheal-display').innerText = player.inventory.over_heal;
    }

    // Start Game
    initMap();
    updateUI();
    draw();
  </script>
</body>
</html>
