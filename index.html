<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cache Hunter</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
    }

    canvas {
      display: block;
      border: 2px solid #444;
      background-color: #2e7d32;
    }

    /* --- CENTERED TRACKABLE POPUP UI --- */
    .trackable-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      justify-content: center; /* Center horizontally */
      align-items: center;     /* Center vertically */
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    .trackable-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .trackable-modal {
      background: #1e1e2f;
      border: 3px solid #f59e0b;
      border-radius: 12px;
      padding: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      transform: scale(0.85);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .trackable-overlay.active .trackable-modal {
      transform: scale(1);
    }

    .trackable-title {
      font-size: 20px;
      font-weight: bold;
      color: #f59e0b;
      margin: 0 0 10px 0;
      text-transform: uppercase;
    }

    .trackable-icon {
      font-size: 48px;
      margin: 10px 0;
      display: inline-block;
    }

    .trackable-desc {
      font-size: 14px;
      color: #ddd;
      margin-bottom: 20px;
    }

    .trackable-btn-group {
      display: flex;
      gap: 10px;
    }

    .trackable-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-claim {
      background: #2ec4b6;
      color: #011627;
    }
    .btn-claim:hover { background: #20a396; }

    .btn-deposit {
      background: #3b82f6;
      color: #fff;
    }
    .btn-deposit:hover { background: #60a5fa; }

    .btn-close {
      background: #64748b;
      color: #fff;
    }
    .btn-close:hover { background: #94a3b8; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- CENTERED TRACKABLE POPUP -->
    <div id="trackable-overlay" class="trackable-overlay">
      <div class="trackable-modal">
        <h2 id="modal-title" class="trackable-title">Trackable Found!</h2>
        <div id="modal-emoji" class="trackable-icon">🤣</div>
        <p id="modal-text" class="trackable-desc">You discovered a trackable item!</p>
        <div class="trackable-btn-group">
          <button id="btn-primary" class="trackable-btn btn-claim">Claim Trackable</button>
          <button id="btn-secondary" class="trackable-btn btn-close">Leave</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- ASSET LOADING ---
    const assets = {
      grass: new Image(),
      rock: new Image(),
      tree: new Image(),
      bush: new Image(),
      idle: [],
      run: []
    };

    assets.grass.src = 'grass.png';
    assets.rock.src = 'Rock1.png';
    assets.tree.src = 'Tree1.png';
    assets.bush.src = 'Bush1.png';

    // Load Animated Player Frames (1 through 6)
    for (let i = 1; i <= 6; i++) {
      let idleImg = new Image();
      idleImg.src = `Idle${i}.png`;
      assets.idle.push(idleImg);

      let runImg = new Image();
      runImg.src = `Run${i}.png`;
      assets.run.push(runImg);
    }

    // --- GAME ENGINE STATE ---
    let player = {
      x: 375,
      y: 275,
      width: 50,
      height: 50,
      speed: 3,
      facingLeft: false,
      isMoving: false,
      animFrame: 0,
      animTimer: 0,
      inventory: []
    };

    let objects = [
      { type: 'tree', x: 100, y: 100, width: 80, height: 100, solid: true },
      { type: 'rock', x: 500, y: 150, width: 60, height: 60, solid: true },
      { type: 'bush', x: 250, y: 350, width: 50, height: 50, solid: false, trackable: { emoji: '🤣', originId: 1 } },
      { type: 'bush', x: 600, y: 400, width: 50, height: 50, solid: false, trackable: { emoji: '😎', originId: 2 } },
      { type: 'bush', x: 150, y: 450, width: 50, height: 50, solid: false, trackable: null }
    ];

    let keys = {};
    let modalOpen = false;
    let nearbyObject = null;

    // --- INPUT HANDLERS ---
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if ((e.key === 'e' || e.key === 'E' || e.code === 'Space') && !modalOpen) {
        interactWithObject();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // --- MOVEMENT & COLLISION ---
    function update() {
      if (modalOpen) return;

      let dx = 0;
      let dy = 0;

      if (keys['w'] || keys['arrowup']) dy -= player.speed;
      if (keys['s'] || keys['arrowdown']) dy += player.speed;
      if (keys['a'] || keys['arrowleft']) { dx -= player.speed; player.facingLeft = true; }
      if (keys['d'] || keys['arrowright']) { dx += player.speed; player.facingLeft = false; }

      player.isMoving = (dx !== 0 || dy !== 0);

      // Handle Animation Frames
      player.animTimer++;
      if (player.animTimer >= 8) {
        player.animFrame = (player.animFrame + 1) % 6;
        player.animTimer = 0;
      }

      // Simple AABB Collision for Solid Objects
      let newX = player.x + dx;
      let newY = player.y + dy;

      let collidedX = false;
      let collidedY = false;

      for (let obj of objects) {
        if (!obj.solid) continue;

        if (checkCollision({ ...player, x: newX }, obj)) collidedX = true;
        if (checkCollision({ ...player, y: newY }, obj)) collidedY = true;
      }

      if (!collidedX) player.x = Math.max(0, Math.min(canvas.width - player.width, newX));
      if (!collidedY) player.y = Math.max(0, Math.min(canvas.height - player.height, newY));

      // Check Nearby Interactive Objects (Bushes/Caches)
      nearbyObject = null;
      for (let obj of objects) {
        if (obj.type === 'bush') {
          let dist = Math.hypot((player.x + player.width / 2) - (obj.x + obj.width / 2), (player.y + player.height / 2) - (obj.y + obj.height / 2));
          if (dist < 50) {
            nearbyObject = obj;
            break;
          }
        }
      }
    }

    function checkCollision(rect1, rect2) {
      return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
      );
    }

    // --- INTERACTION & POPUP ---
    function interactWithObject() {
      if (!nearbyObject) return;

      const overlay = document.getElementById('trackable-overlay');
      const modalTitle = document.getElementById('modal-title');
      const modalEmoji = document.getElementById('modal-emoji');
      const modalText = document.getElementById('modal-text');
      const btnPrimary = document.getElementById('btn-primary');
      const btnSecondary = document.getElementById('btn-secondary');

      // CLAIM TRACKABLE
      if (nearbyObject.trackable) {
        const item = nearbyObject.trackable;
        modalTitle.textContent = "Trackable Found!";
        modalEmoji.textContent = item.emoji;
        modalText.textContent = `You discovered ${item.emoji} inside this bush! Claim it into your inventory?`;

        btnPrimary.className = "trackable-btn btn-claim";
        btnPrimary.textContent = "Claim Trackable";
        btnPrimary.onclick = () => {
          player.inventory.push(item);
          nearbyObject.trackable = null;
          closeModal();
        };

        btnSecondary.onclick = closeModal;
        openModal();
      } 
      // DEPOSIT TRACKABLE
      else if (player.inventory.length > 0) {
        const item = player.inventory[0];
        modalTitle.textContent = "Deposit Trackable";
        modalEmoji.textContent = item.emoji;
        modalText.textContent = `Deposit ${item.emoji} into this bush?`;

        btnPrimary.className = "trackable-btn btn-deposit";
        btnPrimary.textContent = "Deposit Trackable";
        btnPrimary.onclick = () => {
          nearbyObject.trackable = player.inventory.shift();
          closeModal();
        };

        btnSecondary.onclick = closeModal;
        openModal();
      }
    }

    function openModal() {
      modalOpen = true;
      document.getElementById('trackable-overlay').classList.add('active');
    }

    function closeModal() {
      modalOpen = false;
      document.getElementById('trackable-overlay').classList.remove('active');
    }

    // --- RENDER WORLD & ANIMATIONS ---
    function draw() {
      // 1. Draw Tiled Grass Background
      if (assets.grass.complete && assets.grass.width > 0) {
        let pattern = ctx.createPattern(assets.grass, 'repeat');
        ctx.fillStyle = pattern;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. Draw Objects (Trees, Rocks, Bushes)
      objects.forEach(obj => {
        let img = null;
        if (obj.type === 'tree') img = assets.tree;
        if (obj.type === 'rock') img = assets.rock;
        if (obj.type === 'bush') img = assets.bush;

        if (img && img.complete && img.width > 0) {
          ctx.drawImage(img, obj.x, obj.y, obj.width, obj.height);
        } else {
          ctx.fillStyle = obj.solid ? '#555' : '#1b5e20';
          ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
        }

        // Draw trackable indicator over bush if present
        if (obj.trackable) {
          ctx.font = '20px serif';
          ctx.textAlign = 'center';
          ctx.fillText(obj.trackable.emoji, obj.x + obj.width / 2, obj.y - 5);
        }
      });

      // 3. Draw Interaction Prompt
      if (nearbyObject && !modalOpen) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("Press [E] or [SPACE]", nearbyObject.x + nearbyObject.width / 2, nearbyObject.y - 25);
      }

      // 4. Draw Animated Player (Flipped if moving left)
      let currentFrameSet = player.isMoving ? assets.run : assets.idle;
      let playerImg = currentFrameSet[player.animFrame];

      ctx.save();
      if (player.facingLeft) {
        ctx.translate(player.x + player.width, player.y);
        ctx.scale(-1, 1);
        if (playerImg && playerImg.complete && playerImg.width > 0) {
          ctx.drawImage(playerImg, 0, 0, player.width, player.height);
        } else {
          ctx.fillStyle = '#ffb703';
          ctx.fillRect(0, 0, player.width, player.height);
        }
      } else {
        ctx.translate(player.x, player.y);
        if (playerImg && playerImg.complete && playerImg.width > 0) {
          ctx.drawImage(playerImg, 0, 0, player.width, player.height);
        } else {
          ctx.fillStyle = '#ffb703';
          ctx.fillRect(0, 0, player.width, player.height);
        }
      }
      ctx.restore();
    }

    // --- GAME LOOP ---
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
