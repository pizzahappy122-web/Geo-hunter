<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cache Hunter - Trackable Quest</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Top HUD Header */
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 800px;
      padding: 12px 20px;
      background: #1e293b;
      border-radius: 12px 12px 0 0;
      border: 2px solid #334155;
      border-bottom: none;
    }

    .hud-title {
      font-size: 20px;
      font-weight: bold;
      color: #f59e0b;
    }

    .hud-stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
    }

    .badge {
      background: #334155;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
    }

    /* Main Game Canvas */
    #gameCanvas {
      background-color: #15803d;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Bottom Control Bar */
    #instructions {
      width: 800px;
      padding: 10px;
      background: #1e293b;
      border-radius: 0 0 12px 12px;
      border: 2px solid #334155;
      border-top: none;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }

    /* --- CENTERED TRACKABLE POPUP UI --- */
    .trackable-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center; /* Center horizontally */
      align-items: center;     /* Center vertically */
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    .trackable-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .trackable-modal {
      background: #1e293b;
      border: 3px solid #f59e0b;
      border-radius: 16px;
      padding: 24px;
      width: 340px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transform: scale(0.85);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .trackable-overlay.active .trackable-modal {
      transform: scale(1);
    }

    .trackable-title {
      font-size: 20px;
      font-weight: bold;
      color: #f59e0b;
      margin: 0 0 8px 0;
      text-transform: uppercase;
    }

    .trackable-icon {
      font-size: 54px;
      margin: 12px 0;
      display: inline-block;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .trackable-desc {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .trackable-btn-group {
      display: flex;
      gap: 10px;
    }

    .trackable-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-claim {
      background: #10b981;
      color: #022c22;
    }
    .btn-claim:hover { background: #34d399; }

    .btn-deposit {
      background: #3b82f6;
      color: #1e3a8a;
    }
    .btn-deposit:hover { background: #60a5fa; }

    .btn-close {
      background: #64748b;
      color: #ffffff;
    }
    .btn-close:hover { background: #94a3b8; }
  </style>
</head>
<body>

  <!-- Game HUD Header -->
  <div id="hud">
    <div class="hud-title">🧭 CACHE HUNTER</div>
    <div class="hud-stats">
      <div class="badge">🎒 Inventory: <span id="inv-count">0</span> Trackable(s)</div>
      <div class="badge" style="border-color: #f59e0b;">🏆 Quest Progress: <span id="quest-count">0</span>/5 Relocated</div>
    </div>
  </div>

  <!-- Main Game World Area -->
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <div id="instructions">
    Use <b>WASD</b> or <b>Arrow Keys</b> to Move. Walk up to a Geocache or Bush and press <b>E</b> or <b>SPACE</b> to search!
  </div>

  <!-- CENTERED POPUP MODAL OVERLAY -->
  <div id="trackable-overlay" class="trackable-overlay">
    <div class="trackable-modal">
      <h2 id="modal-title" class="trackable-title">Trackable Discovered!</h2>
      <div id="modal-emoji" class="trackable-icon">🤣</div>
      <p id="modal-text" class="trackable-desc">You found a trackable item! Would you like to pick it up?</p>
      <div id="modal-buttons" class="trackable-btn-group">
        <button id="btn-primary" class="trackable-btn btn-claim">Claim Trackable</button>
        <button id="btn-secondary" class="trackable-btn btn-close">Leave</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- GAME ENGINE STATE ---
    const TILE_SIZE = 40;
    const GRID_SIZE = 20; // 20x20 Grid World (800x800 total, viewport scrolling)
    
    const EMOJIS = ['🤣', '😎', '😀', '⭐', '💎'];

    let player = {
      x: 400,
      y: 250,
      size: 26,
      speed: 4,
      inventory: []
    };

    let quest = {
      relocatedCount: 0,
      targetGoal: 5,
      completed: false
    };

    let keys = {};
    let geocaches = [];
    let modalOpen = false;
    let nearbyCache = null;

    // --- WORLD GENERATION ---
    function initWorld() {
      geocaches = [];
      
      // Spawn 10 Caches across the map
      for (let i = 0; i < 10; i++) {
        const hasTrackable = i < 6; // First 6 start with trackables inside
        geocaches.push({
          id: i,
          x: Math.floor(Math.random() * 18 + 1) * TILE_SIZE,
          y: Math.floor(Math.random() * 10 + 1) * TILE_SIZE,
          size: 30,
          trackable: hasTrackable ? {
            id: 't_' + i,
            emoji: EMOJIS[i % EMOJIS.length],
            originCacheId: i
          } : null
        });
      }
    }

    // --- INPUT HANDLING ---
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if ((e.key === 'e' || e.key === 'E' || e.code === 'Space') && !modalOpen) {
        interactWithCache();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // --- MOVEMENT & LOGIC ---
    function update() {
      if (modalOpen) return;

      let dx = 0;
      let dy = 0;

      if (keys['w'] || keys['arrowup']) dy -= player.speed;
      if (keys['s'] || keys['arrowdown']) dy += player.speed;
      if (keys['a'] || keys['arrowleft']) dx -= player.speed;
      if (keys['d'] || keys['arrowright']) dx += player.speed;

      // Keep within canvas bounds
      player.x = Math.max(20, Math.min(canvas.width - 20, player.x + dx));
      player.y = Math.max(20, Math.min(canvas.height - 20, player.y + dy));

      // Check proximity to caches
      nearbyCache = null;
      for (let cache of geocaches) {
        const dist = Math.hypot(player.x - (cache.x + 15), player.y - (cache.y + 15));
        if (dist < 35) {
          nearbyCache = cache;
          break;
        }
      }
    }

    // --- INTERACTION LOGIC ---
    function interactWithCache() {
      if (!nearbyCache) return;

      const overlay = document.getElementById('trackable-overlay');
      const modalTitle = document.getElementById('modal-title');
      const modalEmoji = document.getElementById('modal-emoji');
      const modalText = document.getElementById('modal-text');
      const btnPrimary = document.getElementById('btn-primary');
      const btnSecondary = document.getElementById('btn-secondary');

      // CASE 1: Cache contains a Trackable -> Claim It
      if (nearbyCache.trackable) {
        const trackable = nearbyCache.trackable;
        modalTitle.textContent = "Trackable Found!";
        modalEmoji.textContent = trackable.emoji;
        modalText.textContent = `You found a Trackable (${trackable.emoji}) inside this cache! Add it to your bag?`;
        
        btnPrimary.className = "trackable-btn btn-claim";
        btnPrimary.textContent = "Claim Trackable";
        btnPrimary.onclick = () => {
          player.inventory.push(trackable);
          nearbyCache.trackable = null;
          updateHUD();
          closeModal();
        };

        btnSecondary.onclick = closeModal;
        openModal();
      } 
      // CASE 2: Cache is empty AND player has an item in inventory -> Deposit It
      else if (player.inventory.length > 0) {
        const trackable = player.inventory[0];
        modalTitle.textContent = "Deposit Trackable";
        modalEmoji.textContent = trackable.emoji;
        modalText.textContent = `Do you want to deposit ${trackable.emoji} into this empty cache?`;

        btnPrimary.className = "trackable-btn btn-deposit";
        btnPrimary.textContent = "Deposit Item";
        btnPrimary.onclick = () => {
          const item = player.inventory.shift();
          
          // Check Quest Progress (Relocated to a NEW cache)
          if (item.originCacheId !== nearbyCache.id) {
            quest.relocatedCount++;
            if (quest.relocatedCount >= quest.targetGoal) {
              quest.completed = true;
            }
          }
          
          item.originCacheId = nearbyCache.id;
          nearbyCache.trackable = item;

          updateHUD();
          closeModal();
        };

        btnSecondary.onclick = closeModal;
        openModal();
      }
    }

    function openModal() {
      modalOpen = true;
      document.getElementById('trackable-overlay').classList.add('active');
    }

    function closeModal() {
      modalOpen = false;
      document.getElementById('trackable-overlay').classList.remove('active');
    }

    function updateHUD() {
      document.getElementById('inv-count').textContent = player.inventory.length;
      document.getElementById('quest-count').textContent = `${quest.relocatedCount}`;
    }

    // --- RENDER LOOP ---
    function draw() {
      // Clear screen
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines
      ctx.strokeStyle = '#166534';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw Geocaches
      geocaches.forEach(cache => {
        ctx.fillStyle = cache.trackable ? '#d97706' : '#475569';
        ctx.fillRect(cache.x, cache.y, cache.size, cache.size);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.strokeRect(cache.x, cache.y, cache.size, cache.size);

        // Draw trackable indicator emoji
        if (cache.trackable) {
          ctx.font = '16px serif';
          ctx.textAlign = 'center';
          ctx.fillText(cache.trackable.emoji, cache.x + 15, cache.y + 22);
        }
      });

      // Draw Interaction Prompt
      if (nearbyCache && !modalOpen) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("Press [E] or [SPACE]", nearbyCache.x + 15, nearbyCache.y - 10);
      }

      // Draw Player
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Draw Quest Completed Overlay
      if (quest.completed) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(150, 150, 500, 200);
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("🏆 QUEST COMPLETED! 🏆", 400, 220);
        ctx.fillStyle = '#ffffff';
        ctx.font = '16px sans-serif';
        ctx.fillText("You relocated 5 trackables to new caches!", 400, 270);
      }
    }

    // --- MAIN GAME LOOP ---
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Startup
    initWorld();
    updateHUD();
    gameLoop();
  </script>
</body>
</html>
